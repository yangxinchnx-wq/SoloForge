<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>企鹅图片</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #2C2C2C;
            margin-top: 0;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 5px solid #2C2C2C;
        }
        .note {
            margin-top: 15px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐧 企鹅图片 🐧</h1>
        <img src="penguin.png" alt="可爱的小企鹅">
        <p class="note">由Python matplotlib生成的企鹅图片</p>
    </div>
</body>
</html>
