name: test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test-root:
    name: Backend tests (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps (root)
        run: npm ci
      - name: Run root vitest
        run: npm test

  test-ui:
    name: UI hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps (provides vitest 4)
        run: npm ci
      - name: Install UI deps
        working-directory: UI
        run: npm ci
      - name: Run UI vitest
        working-directory: UI
        run: npx vitest run

  test-python-3-13:
    name: Python 3.13 AI society tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: python
        run: pytest tests/ -v
