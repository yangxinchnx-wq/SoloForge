name: test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test-root:
    name: Backend tests (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps (root)
        run: npm ci
      - name: Run root vitest
        run: npm test

  test-ui:
    name: UI hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps (provides vitest 4)
        run: npm ci
      - name: Install UI deps
        working-directory: UI
        run: npm ci
      - name: Run UI vitest
        working-directory: UI
        run: npx vitest run

  test-python-3-13:
    name: Python 3.13 AI society tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: python
        run: pytest tests/ -v

  e2e-tools:
    # D17 v3 增量 (2026-07-01): CI 跑本 session 关键 e2e 验证工具
    # 防止 M2 幂等 / M1 PRAGMA 全路径 / M4 failover / U4 MiniLM / D17 长跑 回归
    name: E2E tools (M1/M2/M4/U4/D17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil  # stability_test 内存监控需要
      - name: M2 idempotency e2e (8766 HTTP + event_dedup)
        working-directory: python
        run: python tools/m2_idempotency_e2e_test.py
      - name: M1 PRAGMA all-paths (4 production files)
        working-directory: python
        run: python tools/m1_pragma_all_paths_test.py
      - name: M3 outbox concurrency limit
        working-directory: python
        run: python tools/m3_concurrency_test.py
      - name: M4 BatchedWriter failover (3 stages)
        working-directory: python
        run: python tools/m4_failover_test.py
      - name: U4 MiniLM R@3 (real MiniLM, 50 sentence pairs)
        working-directory: python
        run: python tools/u4_minilm_recall_test.py
      - name: D17 stability smoke (5min canary_100, D17 v3 leak fix)
        working-directory: python
        run: |
          python marl_service/stability_test.py \
            --mode canary_100 \
            --duration-sec 120 \
            --sample-every 30
      - name: Upload D17 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d17-smoke-report
          path: python/marl_service/models/d17_*smoke*.json
          if-no-files-found: ignore
