name: test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test-root:
    name: Backend tests (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps (root)
        run: npm ci
      - name: Run root vitest
        run: npm test
      - name: Type check (root)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Upload package-lock.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

  test-ui:
    name: UI hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps (provides vitest 4)
        run: npm ci
      - name: Install UI deps
        working-directory: UI
        run: npm ci
      - name: Run UI tests (ci:test)
        working-directory: UI
        run: npm run ci:test
      - name: Lint (UI)
        working-directory: UI
        run: npm run lint
        continue-on-error: true
      - name: Build UI bundle (ci:build)
        working-directory: UI
        run: npm run ci:build

  test-java:
    name: Java agent build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Build
        working-directory: solo-forge-agent
        run: mvn -B package
      - name: Test
        working-directory: solo-forge-agent
        run: mvn -B test
      - name: Build agent jar (ci:build:agent)
        working-directory: UI
        run: npm run ci:build:agent
      - name: Upload agent jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solo-forge-agent-jar
          path: solo-forge-agent/target/solo-forge-agent-1.0.0.jar

  test-rust:
    name: Rust core build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: rust_core
        run: cargo build --release
      - name: Test
        working-directory: rust_core
        run: cargo test

  test-python-3-13:
    name: Python 3.13 AI society tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: python
        run: pytest tests/ -v

  e2e-tools:
    # D17 v3 增量 (2026-07-01): CI 跑本 session 关键 e2e 验证工具
    # 防止 M2 幂等 / M1 PRAGMA 全路径 / M4 failover / U4 MiniLM / D17 长跑 回归
    name: E2E tools (M1/M2/M4/U4/D17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil  # stability_test 内存监控需要
      - name: M2 idempotency e2e (8766 HTTP + event_dedup)
        working-directory: python
        run: python tools/m2_idempotency_e2e_test.py
      - name: M1 PRAGMA all-paths (4 production files)
        working-directory: python
        run: python tools/m1_pragma_all_paths_test.py
      - name: M3 outbox concurrency limit
        working-directory: python
        run: python tools/m3_concurrency_test.py
      - name: M4 BatchedWriter failover (3 stages)
        working-directory: python
        run: python tools/m4_failover_test.py
      - name: U4 MiniLM R@3 (real MiniLM, 50 sentence pairs)
        working-directory: python
        run: python tools/u4_minilm_recall_test.py
      - name: D17 stability smoke (5min canary_100, D17 v3 leak fix)
        working-directory: python
        run: |
          python marl_service/stability_test.py \
            --mode canary_100 \
            --duration-sec 120 \
            --sample-every 30
      - name: Upload D17 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d17-smoke-report
          path: python/marl_service/models/d17_*smoke*.json
          if-no-files-found: ignore
