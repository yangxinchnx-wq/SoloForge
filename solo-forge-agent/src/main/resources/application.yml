# SoloForge Agent Service 配置
#
# *** FALLBACK STATUS (2026-07-09) ***
# 本 Java Agent 已降级为 fallback 路径。以下模块已被 Node.js RACER 系统替代：
#
#   [已替代] controller/ChatController      → src/server/routes-agent.ts (POST /api/agents/dispatch)
#   [已替代] orchestrator/AgentOrchestrator   → src/core/agent/agent-decision-orchestrator.ts (RACER routing)
#   [已替代] orchestrator/MultiAgentCoordinator → RACER court + coalition 系统
#   [已替代] orchestrator/TaskComplexityEvaluator → RACER complexity scoring
#   [已替代] executor/AgentExecutor           → RACER agent-loop + MCP tools
#   [已替代] llm/LlmGateway                  → src/llm/llmProxy.ts (多 provider 动态路由)
#   [已替代] tools/* (6个工具)                → MCP tools 系统
#   [已替代] advisor/SystemPromptBuilder      → agent-registry.ts prompt 构建
#   [已替代] aisociety/ReputationClient       → src/server/routes-agent.ts reputation bridge
#   [已替代] aisociety/EconomyClient          → src/core/agent/ credit 系统
#   [已替代] aisociety/GovernanceClient       → src/core/agent/ court 系统
#   [已替代] aisociety/CoalitionClient        → RACER coalition 系统
#   [已替代] aisociety/LawClient              → RACER 规则引擎
#   [已替代] aisociety/CultureClient          → RACER 文化约束
#   [已替代] aisociety/MemoryClient           → SurrealDB 持久化
#   [已替代] aisociety/InstitutionClient      → RACER 制度系统
#   [已替代] aisociety/MarlTrainingClient     → MAPPO IPC (src/kernel/)
#   [已替代] aisociety/CaseRetriever          → RACER 经验检索
#
#   [保留]   training/* (7个文件)             → 离线训练/Prompt优化 (Node.js 无对等实现)
#   [保留]   persistence/AgentTrainingHistory → 训练历史记录
#   [保留]   config/SqliteConfig              → SQLite 连接配置
#
# 保留本服务的场景：Node.js RACER 不可用时的 fallback 路径
# ****************************************************
server:
  port: 8770   # 注意：Node.js RACER 使用 src/api-server.ts 监听端口，本端口仅 fallback 时使用
  servlet:
    context-path: /

spring:
  application:
    name: solo-forge-agent

  # Spring AI 2.0 配置 — 动态多 Provider 由 LlmConfig.java 管理
  # [Path C] 不再使用静态 spring.ai.* 配置，改为请求级动态注入
  # ChatModel Bean 在 LlmConfig 中按 provider 名称注册，运行时按需路由
  ai:
    chatbot:

  # Garnet (Redis 协议) - ChatMemory 持久化
  # [已替代] Node.js RACER 使用 SurrealDB 持久化，Redis 仅 Java Agent fallback 时使用
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # SQLite (AI Society 共享数据库) - AgentConfig + 业务表
  # 路径解析优先级:
  #   1. 环境变量 SOLOFORGE_SQLITE_URL (如 jdbc:sqlite:/path/to/ai_society.db)
  #   2. 默认: 相对于 jar 所在目录的 ../python/data/ai_society/ai_society.db
  datasource:
    url: ${SOLOFORGE_SQLITE_URL:jdbc:sqlite:../python/data/ai_society/ai_society.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

# AI Society 服务地址
# [已替代] 以下 aisociety 客户端全部已被 src/core/agent/ + src/server/ 的 RACER 流程替代
# 仅 training 模块仍需 8765/8766 端口推送训练数据
ai-society:
  # 8766 HTTP - reputation 推送
  reputation-url: http://127.0.0.1:8766/sync/reputation
  # 8765 TCP - MARL 训练数据推送
  marl-host: 127.0.0.1
  marl-port: 8765
  # 8766 HTTP - 业务表查询（通过 Python 暴露的只读 API）
  query-url: http://127.0.0.1:8766

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: solo-forge-agent

# Phase 5: 离线训练配置
soloforge:
  training:
    enabled: true                    # 训练功能总开关
    scheduler:
      enabled: false                 # 定时调度已禁用 (改为手动/反馈触发)
    improvement-threshold: 0.05      # reward 提升 5% 以上才采纳新 prompt
    feedback:
      trigger-threshold: 5           # 累积 5 条 negative 反馈后触发优化
    llm:
      # 本地小模型 (Python MARL 服务 8767 端口, llama-cpp-python + GGUF)
      # 无需外部 API key, 离线可用
      base-url: ${SOLOFORGE_TRAINING_LLM_BASE_URL:http://127.0.0.1:8767}
      api-key: local                 # 占位, 本地服务不需要鉴权
      model: ${SOLOFORGE_TRAINING_LLM_MODEL:qwen2.5-0.5b-instruct}

# 日志
logging:
  level:
    com.soloforge.agent: INFO
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
