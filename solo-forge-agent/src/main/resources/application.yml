# SoloForge Agent Service 配置
#
# *** FALLBACK STATUS (2026-07-15) ***
# 本 Java Agent 已降级为 fallback 路径，主路径为 Node.js RACER 系统。
# 以下旧模块已删除，功能由 RACER 完全替代：
#
#   [已删除→RACER] controller/ChatController      → src/server/routes-agent.ts
#   [已删除→RACER] executor/AgentExecutor          → src/core/agent/tools/function-calling-client.ts
#   [已删除→RACER] llm/LlmGateway                  → src/llm/llmProxyHandler.ts
#   [已删除→RACER] llm/LlmRateLimiter              → src/llm/circuit-breaker.ts (熔断器)
#   [已删除→RACER] tools/ToolRegistry              → src/core/agent/tools/tool-definitions.ts (@Tool 注解)
#   [已删除→RACER] tools/ReadFileTool 等 6 个       → src/core/agent/tools/ (MCP tools)
#   [已删除→RACER] advisor/RateLimitAdvisor         → circuit-breaker.ts (集成到 function-calling-client)
#
# 以下模块仍保留在 Java Agent 中 (RACER 有对等实现, Java 作为 fallback):
#   config/LlmConfig                 → Spring AI 1.0.0 GA ChatModel Bean 配置
#   config/DynamicChatModelResolver  → 运行时 provider 路由
#   executor/SpringAiAgentExecutor   → Spring AI ChatClient 执行器 (fallback)
#   executor/StreamingResponseAdapter → 流式响应适配
#   advisor/SoloForgeAdvisors        → Spring AI Advisor 链 (Legal/Credit/PostToolCall)
#   orchestrator/*                   → 多 Agent 编排 (fallback)
#   aisociety/*                      → AI 社会子系统客户端 (fallback, RACER 有对等实现)
#   advisor/SystemPromptBuilder      → 系统提示构建 (fallback)
#
# 以下模块仅保留在 Java Agent 中 (Node.js 无对等实现):
#   [Java独占] training/* (离线训练/Prompt优化)
#   [Java独占] persistence/AgentTrainingHistory (训练历史)
#   [Java独占] config/SqliteConfig (SQLite 连接)
#
# RACER 主路径已补充 Circuit Breaker (src/llm/circuit-breaker.ts),
# 移植自 Java LlmCommandCenter 熔断器逻辑。
# ****************************************************
server:
  port: 8770   # 注意：Node.js RACER 使用 src/api-server.ts 监听端口，本端口仅 fallback 时使用
  servlet:
    context-path: /

spring:
  application:
    name: solo-forge-agent

  # Spring AI 1.0.0 GA 配置 — 动态多 Provider 由 LlmConfig.java 管理
  # 不再使用静态 spring.ai.* 配置，改为请求级动态注入
  # ChatModel Bean 在 LlmConfig 中按 provider 名称注册，运行时按需路由
  ai:
    chatbot:

  # Garnet (Redis 协议) - ChatMemory 持久化
  # [已替代] Node.js RACER 使用 SurrealDB 持久化，Redis 仅 Java Agent fallback 时使用
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # SQLite (AI Society 共享数据库) - AgentConfig + 业务表
  # 路径解析优先级:
  #   1. 环境变量 SOLOFORGE_SQLITE_URL (如 jdbc:sqlite:/path/to/ai_society.db)
  #   2. 默认: 相对于 jar 所在目录的 ../python/data/ai_society/ai_society.db
  datasource:
    url: ${SOLOFORGE_SQLITE_URL:jdbc:sqlite:../python/data/ai_society/ai_society.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

# AI Society 服务地址
# [已替代] 以下 aisociety 客户端全部已被 src/core/agent/ + src/server/ 的 RACER 流程替代
# 仅 training 模块仍需 8765/8766 端口推送训练数据
ai-society:
  # 8766 HTTP - reputation 推送
  reputation-url: http://127.0.0.1:8766/sync/reputation
  # 8765 TCP - MARL 训练数据推送
  marl-host: 127.0.0.1
  marl-port: 8765
  # 8766 HTTP - 业务表查询（通过 Python 暴露的只读 API）
  query-url: http://127.0.0.1:8766

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: solo-forge-agent

# Phase 5: 离线训练配置
soloforge:
  training:
    enabled: true                    # 训练功能总开关
    scheduler:
      enabled: false                 # 定时调度已禁用 (改为手动/反馈触发)
    improvement-threshold: 0.05      # reward 提升 5% 以上才采纳新 prompt
    feedback:
      trigger-threshold: 5           # 累积 5 条 negative 反馈后触发优化
    llm:
      # 本地小模型 (Python MARL 服务 8767 端口, llama-cpp-python + GGUF)
      # 无需外部 API key, 离线可用
      base-url: ${SOLOFORGE_TRAINING_LLM_BASE_URL:http://127.0.0.1:8767}
      api-key: local                 # 占位, 本地服务不需要鉴权
      model: ${SOLOFORGE_TRAINING_LLM_MODEL:qwen2.5-0.5b-instruct}

# 日志
logging:
  level:
    com.soloforge.agent: INFO
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
