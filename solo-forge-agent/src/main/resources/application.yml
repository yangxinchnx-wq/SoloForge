# SoloForge Agent Service 配置
#
# *** STREAMING SSE ARCHITECTURE (2026-07-18) ***
# Java Agent 提供聊天流式端点 POST /api/chat/stream (SseEmitter)。
# 聊天路径: 前端 → Node.js 代理 → Java SSE (SseEmitter)。
# TCP 8771 传输已移除，改为 HTTP SSE 直出。
#
# 核心模块:
#   controller/ChatStreamController  → POST /api/chat/stream (SSE 流式聊天)
#   controller/ChatController        → Agent 管理 CRUD + 健康检查
#   executor/MultiWorkerExecutionService → 多 Worker 并行执行 + SSE 事件输出
#   config/LlmConfig                 → Spring AI 2.0.0 GA ChatModel Bean
#   config/DynamicChatModelResolver  → 运行时 provider 路由
#   config/SqliteConfig              → SQLite 连接配置
#   advisor/* (10个文件)             → Spring AI Advisor 链 (SystemPrompt/RAG/Pool/RateLimit/Audit 等)
#   training/* (7个文件)             → 离线 Prompt 优化 + 反馈案例库
#   persistence/* (6个文件)          → Agent 身份/训练历史/经验案例 持久化
#   tools/* (SoloForgeTools/RemoteToolExecutor/OpenAiStreamClient) → 工具执行 + LLM 流式客户端
# ****************************************************
server:
  port: 8770   # Java Agent 端口 — 聊天 SSE + 管理 API + 训练
  servlet:
    context-path: /

spring:
  application:
    name: solo-forge-agent

  # 允许覆盖 Spring AI 自动配置的同名 Bean (如 anthropicChatModel)
  main:
    allow-bean-definition-overriding: true

  # 禁用 Spring AI 自动配置的 ChatModel Bean (我们用 LlmConfig.java 手动管理)
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  # Spring AI 2.0.0 GA 配置 — 动态多 Provider 由 LlmConfig.java 管理
  # 不再使用静态 spring.ai.* 配置，改为请求级动态注入
  # ChatModel Bean 在 LlmConfig 中按 provider 名称注册，运行时按需路由
  ai:
    chatbot:

  # SQLite (AI Society 共享数据库) - AgentConfig + 业务表
  # 路径解析优先级:
  #   1. 环境变量 SOLOFORGE_SQLITE_URL (如 jdbc:sqlite:/path/to/ai_society.db)
  #   2. 默认: 相对于 jar 所在目录的 ../python/data/ai_society/ai_society.db
  datasource:
    url: ${SOLOFORGE_SQLITE_URL:jdbc:sqlite:../python/data/ai_society/ai_society.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

# AI Society 服务地址
# [已替代] 以下 aisociety 客户端全部已被 src/core/agent/ + src/server/ 的 RACER 流程替代
# 仅 training 模块仍需 8765/8766 端口推送训练数据
ai-society:
  # 8766 HTTP - reputation 推送
  reputation-url: http://127.0.0.1:8766/sync/reputation
  # 8765 TCP - MARL 训练数据推送
  marl-host: 127.0.0.1
  marl-port: 8765
  # 8766 HTTP - 业务表查询（通过 Python 暴露的只读 API）
  query-url: http://127.0.0.1:8766

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: solo-forge-agent

# Phase 5: 离线训练配置
soloforge:
  training:
    enabled: true                    # 训练功能总开关
    scheduler:
      enabled: false                 # 定时调度已禁用 (改为手动/反馈触发)
    improvement-threshold: 0.05      # reward 提升 5% 以上才采纳新 prompt
    feedback:
      trigger-threshold: 5           # 累积 5 条 negative 反馈后触发优化
    llm:
      # 本地小模型 (Python MARL 服务 8767 端口, llama-cpp-python + GGUF)
      # 无需外部 API key, 离线可用
      base-url: ${SOLOFORGE_TRAINING_LLM_BASE_URL:http://127.0.0.1:8767}
      api-key: local                 # 占位, 本地服务不需要鉴权
      model: ${SOLOFORGE_TRAINING_LLM_MODEL:qwen2.5-0.5b-instruct}

# 日志
logging:
  level:
    com.soloforge.agent: INFO
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
