<!doctype html>
<!-- SoloForge UI 入口 HTML — 主题预设只在 ThemeContext.tsx 中维护,FOUC 防护由 Electron 主进程处理 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoloForge</title>
    <!--
      内联 boot 样式: 硬编码浅色背景 + lightning logo,不依赖 CSS 变量。
      在 Vite/Tailwind CSS bundle 下载前就生效,防止强制刷新闪白。
      一旦 index.css 加载,html/body 的背景色会被
      正确的主题色覆盖。
      #sf-boot-loader 在 React mount 后被自动替换消失。
    -->
    <style>
      html, body {
        background-color: #fafafa;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #sf-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fafafa;
        z-index: 2147483647;
      }
      #sf-boot-logo {
        width: 200px;
        height: 200px;
        object-fit: contain;
        filter: drop-shadow(0 2px 12px rgba(0,0,0,.1));
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="sf-boot-loader">
        <img id="sf-boot-logo" src="/lightning_logo.png" alt="SoloForge">
      </div>
    </div>

  </body>
</html>
