<!DOCTYPE html>
<html class="dark" lang="zh-CN" data-theme="default-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoloForge</title>

  <!-- Tailwind 通过 PostCSS 构建（tailwind.config.js + postcss.config.js），不再走 CDN -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; overflow: hidden; }

    /* Material Symbols 基础样式 */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* 滚动条隐藏 */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* 主题过渡动画 */
    * { transition: background-color 0.2s ease, color 0.15s ease, border-color 0.2s ease; }
  </style>
</head>
<body class="bg-bg text-text font-sans">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
