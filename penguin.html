<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐧 可爱企鹅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #E0F7FA 70%, #FFFFFF 100%);
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  .scene {
    position: relative;
    width: 400px; height: 550px;
  }

  /* 雪地 */
  .snow-ground {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 120px;
    background: #fff;
    border-radius: 50% 50% 0 0;
    box-shadow: 0 -5px 20px rgba(200,230,255,0.5);
  }
  .snow-hill {
    position: absolute; bottom: 0;
    background: #fff;
    border-radius: 50%;
  }
  .snow-hill:nth-child(1) { left: -30px; width: 180px; height: 80px; }
  .snow-hill:nth-child(2) { right: -40px; width: 200px; height: 90px; }

  /* 企鹅容器 */
  .penguin {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    animation: wobble 2s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: translateX(-50%) rotate(-2deg); }
    50% { transform: translateX(-50%) rotate(2deg); }
  }

  /* 身体 */
  .body {
    position: relative;
    width: 140px; height: 180px;
    background: #1a1a2e;
    border-radius: 50% 50% 45% 45%;
    z-index: 2;
  }

  /* 白色肚子 */
  .belly {
    position: absolute;
    top: 30px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 140px;
    background: #f5f5f5;
    border-radius: 50% 50% 45% 45%;
  }

  /* 头部 */
  .head {
    position: absolute;
    top: -55px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 100px;
    background: #1a1a2e;
    border-radius: 50%;
    z-index: 3;
  }

  /* 脸部白色区域 */
  .face {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 60px;
    background: #f5f5f5;
    border-radius: 50%;
  }

  /* 眼睛 */
  .eye {
    position: absolute;
    top: 30px;
    width: 22px; height: 26px;
    background: #1a1a2e;
    border-radius: 50%;
    z-index: 4;
  }
  .eye::after {
    content: '';
    position: absolute;
    top: 5px; left: 6px;
    width: 10px; height: 12px;
    background: #fff;
    border-radius: 50%;
    animation: blink 4s ease-in-out infinite;
  }
  .eye.left { left: 22px; }
  .eye.right { right: 22px; }

  @keyframes blink {
    0%, 45%, 55%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }

  /* 嘴巴 */
  .beak {
    position: absolute;
    top: 52px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 20px solid #FF8C00;
    z-index: 5;
    filter: drop-shadow(0 2px 0 #E67600);
  }

  /* 腮红 */
  .cheek {
    position: absolute;
    top: 48px;
    width: 18px; height: 12px;
    background: rgba(255, 150, 150, 0.6);
    border-radius: 50%;
    z-index: 4;
  }
  .cheek.left { left: 12px; }
  .cheek.right { right: 12px; }

  /* 翅膀 */
  .wing {
    position: absolute;
    top: 10px;
    width: 40px; height: 100px;
    background: #1a1a2e;
    z-index: 1;
  }
  .wing.left {
    left: -20px;
    border-radius: 50% 20% 30% 50%;
    transform: rotate(15deg);
    transform-origin: top right;
    animation: wave-left 1.5s ease-in-out infinite;
  }
  .wing.right {
    right: -20px;
    border-radius: 20% 50% 50% 30%;
    transform: rotate(-15deg);
    transform-origin: top left;
    animation: wave-right 1.5s ease-in-out infinite;
  }

  @keyframes wave-left {
    0%, 100% { transform: rotate(15deg); }
    50% { transform: rotate(25deg); }
  }
  @keyframes wave-right {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(-25deg); }
  }

  /* 脚 */
  .feet {
    position: absolute;
    bottom: -15px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px;
    z-index: 2;
  }
  .foot {
    position: absolute;
    bottom: 0;
    width: 50px; height: 18px;
    background: #FF8C00;
    border-radius: 50%;
  }
  .foot.left { left: 5px; }
  .foot.right { right: 5px; }

  /* 围巾 */
  .scarf {
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 22px;
    background: #E74C3C;
    border-radius: 10px;
    z-index: 6;
  }
  .scarf::after {
    content: '';
    position: absolute;
    right: 15px; top: 12px;
    width: 18px; height: 45px;
    background: #E74C3C;
    border-radius: 0 0 8px 8px;
    transform: rotate(10deg);
  }
  .scarf-stripe {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 6px;
    background: #C0392B;
    border-radius: 3px;
    z-index: 7;
  }

  /* 飘落的雪花 */
  .snowflake {
    position: absolute;
    color: #fff;
    font-size: 16px;
    opacity: 0.8;
    animation: fall linear infinite;
  }
  .snowflake:nth-child(1) { left: 10%; animation-duration: 6s; animation-delay: 0s; font-size: 12px; }
  .snowflake:nth-child(2) { left: 25%; animation-duration: 8s; animation-delay: 1s; font-size: 18px; }
  .snowflake:nth-child(3) { left: 45%; animation-duration: 7s; animation-delay: 2s; font-size: 14px; }
  .snowflake:nth-child(4) { left: 65%; animation-duration: 9s; animation-delay: 0.5s; font-size: 10px; }
  .snowflake:nth-child(5) { left: 80%; animation-duration: 6.5s; animation-delay: 3s; font-size: 16px; }
  .snowflake:nth-child(6) { left: 55%; animation-duration: 7.5s; animation-delay: 1.5s; font-size: 11px; }
  .snowflake:nth-child(7) { left: 35%; animation-duration: 5.5s; animation-delay: 4s; font-size: 13px; }

  @keyframes fall {
    0% { top: -10%; opacity: 0; transform: translateX(0) rotate(0deg); }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { top: 100%; opacity: 0; transform: translateX(30px) rotate(360deg); }
  }

  /* 小星星装饰 */
  .star {
    position: absolute;
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s ease-in-out infinite;
  }
  .star:nth-child(1) { top: 5%; left: 15%; animation-delay: 0s; }
  .star:nth-child(2) { top: 12%; left: 75%; animation-delay: 0.5s; width: 3px; height: 3px; }
  .star:nth-child(3) { top: 8%; left: 40%; animation-delay: 1s; }
  .star:nth-child(4) { top: 18%; left: 88%; animation-delay: 1.5s; width: 5px; height: 5px; }
  .star:nth-child(5) { top: 15%; left: 25%; animation-delay: 0.8s; width: 3px; height: 3px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* 心形气泡 */
  .heart-bubble {
    position: absolute;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    animation: float-heart 3s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes float-heart {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    50% { transform: translateX(-50%) translateY(-15px); opacity: 0.7; }
  }
</style>
</head>
<body>
<div class="scene">
  <!-- 星星 -->
  <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>

  <!-- 雪花 -->
  <div class="snowflake">❄</div><div class="snowflake">❅</div><div class="snowflake">❆</div>
  <div class="snowflake">❄</div><div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>

  <!-- 企鹅 -->
  <div class="penguin">
    <div class="heart-bubble">❤️</div>
    <div class="body">
      <div class="head">
        <div class="face"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="beak"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>
      <div class="scarf"></div>
      <div class="scarf-stripe"></div>
      <div class="belly"></div>
      <div class="wing left"></div>
      <div class="wing right"></div>
      <div class="feet">
        <div class="foot left"></div>
        <div class="foot right"></div>
      </div>
    </div>
  </div>

  <!-- 雪地 -->
  <div class="snow-ground">
    <div class="snow-hill"></div>
    <div class="snow-hill"></div>
  </div>
</div>
</body>
</html>
