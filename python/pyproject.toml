# -*- coding: utf-8 -*-
# ─────────────────────────────────────────────────────────────────
# SoloForge AI Society - Python Module Configuration
# Python: 3.13.9 (3.12 兼容至 2026-Q4, python-build-standalone)
# ─────────────────────────────────────────────────────────────────

[project]
name = "soloforge-ai-society"
version = "1.0.0"
description = "AI Society Core Module for SoloForge - Social Memory, Reputation, Governance"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.10.0,<1.0.0",
    "numpy>=1.26.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
