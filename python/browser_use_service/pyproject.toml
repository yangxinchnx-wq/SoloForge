[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soloforge-browser-use-service"
version = "0.1.0"
description = "SoloForge Browser-Use Service — high-level LLM-driven browser tasks on top of Obscura CDP"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SoloForge" }]

dependencies = [
    "msgpack>=1.0.0",
    "mcp>=1.0.0",
    "browser-use>=0.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_use_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
